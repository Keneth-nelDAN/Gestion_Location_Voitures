<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewLocationTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewLocationLabel_idLocation}"/>
                    <h:outputText value="#{locationController.selected.idLocation}" title="#{bundle.ViewLocationTitle_idLocation}"/>
                    <h:outputText value="#{bundle.ViewLocationLabel_dateCreation}"/>
                    <h:outputText value="#{locationController.selected.dateCreation}" title="#{bundle.ViewLocationTitle_dateCreation}">
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewLocationLabel_dateDebutPrevue}"/>
                    <h:outputText value="#{locationController.selected.dateDebutPrevue}" title="#{bundle.ViewLocationTitle_dateDebutPrevue}">
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewLocationLabel_dateFinPrevue}"/>
                    <h:outputText value="#{locationController.selected.dateFinPrevue}" title="#{bundle.ViewLocationTitle_dateFinPrevue}">
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewLocationLabel_dateDebutEffective}"/>
                    <h:outputText value="#{locationController.selected.dateDebutEffective}" title="#{bundle.ViewLocationTitle_dateDebutEffective}">
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewLocationLabel_tarifJournalierApplique}"/>
                    <h:outputText value="#{locationController.selected.tarifJournalierApplique}" title="#{bundle.ViewLocationTitle_tarifJournalierApplique}"/>
                    <h:outputText value="#{bundle.ViewLocationLabel_montantEstime}"/>
                    <h:outputText value="#{locationController.selected.montantEstime}" title="#{bundle.ViewLocationTitle_montantEstime}"/>
                    <h:outputText value="#{bundle.ViewLocationLabel_statutLocation}"/>
                    <h:outputText value="#{locationController.selected.statutLocation}" title="#{bundle.ViewLocationTitle_statutLocation}"/>
                    <h:outputText value="#{bundle.ViewLocationLabel_retour}"/>
                    <h:outputText value="#{locationController.selected.retour}" title="#{bundle.ViewLocationTitle_retour}"/>
                    <h:outputText value="#{bundle.ViewLocationLabel_idClient}"/>
                    <h:outputText value="#{locationController.selected.idClient}" title="#{bundle.ViewLocationTitle_idClient}"/>
                    <h:outputText value="#{bundle.ViewLocationLabel_idUtilisateur}"/>
                    <h:outputText value="#{locationController.selected.idUtilisateur}" title="#{bundle.ViewLocationTitle_idUtilisateur}"/>
                    <h:outputText value="#{bundle.ViewLocationLabel_idVehicule}"/>
                    <h:outputText value="#{locationController.selected.idVehicule}" title="#{bundle.ViewLocationTitle_idVehicule}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{locationController.destroyAndView}" value="#{bundle.ViewLocationDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewLocationEditLink}"/>
                <br />
                <h:commandLink action="#{locationController.prepareCreate}" value="#{bundle.ViewLocationCreateLink}" />
                <br />
                <h:commandLink action="#{locationController.prepareList}" value="#{bundle.ViewLocationShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewLocationIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>
