<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateLocationTitle}" />
        </ui:define>
        <ui:define name="body">
            <p class="text-muted"><h:outputText value="#{bundle.AutoIdInfo}" /></p>
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table" />
            <h:form styleClass="row g-3">
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.AutoDateCreation}" for="dateCreation" styleClass="form-label" />
                    <h:outputText id="dateCreation" value="#{locationController.selected.dateCreation}" styleClass="form-control-plaintext">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.AutoMontantEstime}" for="montantEstime" styleClass="form-label" />
                    <h:outputText id="montantEstime" value="#{locationController.selected.montantEstime}" styleClass="form-control-plaintext">
                        <f:convertNumber pattern="#,##0" />
                    </h:outputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateLocationLabel_dateDebutPrevue}" for="dateDebutPrevue" styleClass="form-label" />
                    <h:inputText id="dateDebutPrevue" value="#{locationController.selected.dateDebutPrevue}" styleClass="form-control" required="true">
                        <f:convertDateTime pattern="dd/MM/yyyy" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateLocationLabel_dateFinPrevue}" for="dateFinPrevue" styleClass="form-label" />
                    <h:inputText id="dateFinPrevue" value="#{locationController.selected.dateFinPrevue}" styleClass="form-control" required="true">
                        <f:convertDateTime pattern="dd/MM/yyyy" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateLocationLabel_dateDebutEffective}" for="dateDebutEffective" styleClass="form-label" />
                    <h:inputText id="dateDebutEffective" value="#{locationController.selected.dateDebutEffective}" styleClass="form-control">
                        <f:convertDateTime pattern="dd/MM/yyyy" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateLocationLabel_tarifJournalierApplique}" for="tarifJournalierApplique" styleClass="form-label" />
                    <h:inputText id="tarifJournalierApplique" value="#{locationController.selected.tarifJournalierApplique}" styleClass="form-control" required="true">
                        <f:validateLongRange minimum="0" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateLocationLabel_statutLocation}" for="statutLocation" styleClass="form-label" />
                    <h:selectOneMenu id="statutLocation" value="#{locationController.selected.statutLocation}" styleClass="form-select" required="true">
                        <f:selectItem itemLabel="#{bundle.LocationStatutEnAttente}" itemValue="En attente" />
                        <f:selectItem itemLabel="#{bundle.LocationStatutEnCours}" itemValue="En cours" />
                        <f:selectItem itemLabel="#{bundle.LocationStatutTerminee}" itemValue="Terminée" />
                        <f:selectItem itemLabel="#{bundle.LocationStatutAnnulee}" itemValue="Annulée" />
                    </h:selectOneMenu>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateLocationLabel_retour}" for="retour" styleClass="form-label" />
                    <h:selectOneMenu id="retour" value="#{locationController.selected.retour}" styleClass="form-select">
                        <f:selectItems value="#{retourController.itemsAvailableSelectOne}" />
                    </h:selectOneMenu>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateLocationLabel_idClient}" for="idClient" styleClass="form-label" />
                    <h:selectOneMenu id="idClient" value="#{locationController.selected.idClient}" styleClass="form-select" required="true" requiredMessage="#{bundle.CreateLocationRequiredMessage_idClient}">
                        <f:selectItems value="#{clientController.itemsAvailableSelectOne}" />
                    </h:selectOneMenu>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateLocationLabel_idUtilisateur}" for="idUtilisateur" styleClass="form-label" />
                    <h:selectOneMenu id="idUtilisateur" value="#{locationController.selected.idUtilisateur}" styleClass="form-select" required="true" requiredMessage="#{bundle.CreateLocationRequiredMessage_idUtilisateur}">
                        <f:selectItems value="#{utilisateurController.itemsAvailableSelectOne}" />
                    </h:selectOneMenu>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateLocationLabel_idVehicule}" for="idVehicule" styleClass="form-label" />
                    <h:selectOneMenu id="idVehicule" value="#{locationController.selected.idVehicule}" styleClass="form-select" required="true" requiredMessage="#{bundle.CreateLocationRequiredMessage_idVehicule}">
                        <f:selectItems value="#{vehiculeController.vehiculesDisponiblesSelectOne}" />
                    </h:selectOneMenu>
                </div>
                <div class="col-12 d-flex gap-2">
                    <h:commandLink styleClass="btn btn-primary" action="#{locationController.create}" value="#{bundle.CreateLocationSaveLink}" />
                    <h:commandLink styleClass="btn btn-outline-secondary" action="#{locationController.prepareList}" value="#{bundle.CreateLocationShowAllLink}" immediate="true" />
                    <h:link outcome="/index" styleClass="btn btn-outline-secondary" value="#{bundle.CreateLocationIndexLink}" />
                </div>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
