<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditVehiculeTitle}" />
        </ui:define>
        <ui:define name="body">
            <p class="text-muted"><h:outputText value="#{bundle.AutoIdInfo}" /></p>
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table" />
            <h:form styleClass="row g-3">
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.EditVehiculeLabel_immatriculation}" for="immatriculation" styleClass="form-label" />
                    <h:inputText id="immatriculation" value="#{vehiculeController.selected.immatriculation}" styleClass="form-control" required="true" requiredMessage="#{bundle.EditVehiculeRequiredMessage_immatriculation}">
                        <f:validateLength minimum="5" maximum="50" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.EditVehiculeLabel_marque}" for="marque" styleClass="form-label" />
                    <h:inputText id="marque" value="#{vehiculeController.selected.marque}" styleClass="form-control" required="true" requiredMessage="#{bundle.EditVehiculeRequiredMessage_marque}" />
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.EditVehiculeLabel_modele}" for="modele" styleClass="form-label" />
                    <h:inputText id="modele" value="#{vehiculeController.selected.modele}" styleClass="form-control" required="true" requiredMessage="#{bundle.EditVehiculeRequiredMessage_modele}" />
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.EditVehiculeLabel_categorie}" for="categorie" styleClass="form-label" />
                    <h:inputText id="categorie" value="#{vehiculeController.selected.categorie}" styleClass="form-control">
                        <f:validateLongRange minimum="0" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.EditVehiculeLabel_couleur}" for="couleur" styleClass="form-label" />
                    <h:inputText id="couleur" value="#{vehiculeController.selected.couleur}" styleClass="form-control" />
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.EditVehiculeLabel_kilometrage}" for="kilometrage" styleClass="form-label" />
                    <h:inputText id="kilometrage" value="#{vehiculeController.selected.kilometrage}" styleClass="form-control">
                        <f:validateLongRange minimum="0" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.EditVehiculeLabel_tarifJournalier}" for="tarifJournalier" styleClass="form-label" />
                    <h:inputText id="tarifJournalier" value="#{vehiculeController.selected.tarifJournalier}" styleClass="form-control" required="true">
                        <f:validateLongRange minimum="0" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.EditVehiculeLabel_etatVehicule}" for="etatVehicule" styleClass="form-label" />
                    <h:selectOneMenu id="etatVehicule" value="#{vehiculeController.selected.etatVehicule}" styleClass="form-select" required="true">
                        <f:selectItem itemLabel="Neuf" itemValue="Neuf" />
                        <f:selectItem itemLabel="Bon état" itemValue="Bon état" />
                        <f:selectItem itemLabel="Usure normale" itemValue="Usure normale" />
                        <f:selectItem itemLabel="À réparer" itemValue="À réparer" />
                    </h:selectOneMenu>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.EditVehiculeLabel_statutDisponible}" for="statutDisponible" styleClass="form-label" />
                    <h:selectOneMenu id="statutDisponible" value="#{vehiculeController.selected.statutDisponible}" styleClass="form-select" required="true">
                        <f:selectItem itemLabel="#{bundle.VehiculeStatutDisponible}" itemValue="Disponible" />
                        <f:selectItem itemLabel="#{bundle.VehiculeStatutIndisponible}" itemValue="Indisponible" />
                    </h:selectOneMenu>
                </div>
                <div class="col-12 d-flex gap-2">
                    <h:commandLink styleClass="btn btn-primary" action="#{vehiculeController.update}" value="#{bundle.EditVehiculeSaveLink}" />
                    <h:link outcome="View" styleClass="btn btn-outline-secondary" value="#{bundle.EditVehiculeViewLink}" />
                    <h:commandLink styleClass="btn btn-outline-secondary" action="#{vehiculeController.prepareList}" value="#{bundle.EditVehiculeShowAllLink}" immediate="true" />
                    <h:link outcome="/index" styleClass="btn btn-outline-secondary" value="#{bundle.EditVehiculeIndexLink}" />
                </div>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
