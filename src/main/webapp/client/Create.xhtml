<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{clientController.prepareCreate}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateClientTitle}" />
        </ui:define>
        <ui:define name="body">
            <p class="text-muted"><h:outputText value="#{bundle.AutoIdInfo}" /></p>
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table" />
            <h:form styleClass="row g-3">
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateClientLabel_nom}" for="nom" styleClass="form-label" />
                    <h:inputText id="nom" value="#{clientController.selected.nom}" styleClass="form-control" required="true" requiredMessage="#{bundle.CreateClientRequiredMessage_nom}">
                        <f:validateLength minimum="2" maximum="100" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateClientLabel_prenom}" for="prenom" styleClass="form-label" />
                    <h:inputText id="prenom" value="#{clientController.selected.prenom}" styleClass="form-control" required="true" requiredMessage="#{bundle.CreateClientRequiredMessage_prenom}">
                        <f:validateLength minimum="2" maximum="100" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateClientLabel_telephone}" for="telephone" styleClass="form-label" />
                    <h:inputText id="telephone" value="#{clientController.selected.telephone}" styleClass="form-control">
                        <f:validateRegex pattern="[+0-9 ()\-]{8,30}" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateClientLabel_email}" for="email" styleClass="form-label" />
                    <h:inputText id="email" value="#{clientController.selected.email}" styleClass="form-control" validatorMessage="#{bundle.EmailInvalid}">
                        <f:validateRegex pattern="[^@\s]+@[^@\s]+\.[^@\s]+" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateClientLabel_numeroPermis}" for="numeroPermis" styleClass="form-label" />
                    <h:inputText id="numeroPermis" value="#{clientController.selected.numeroPermis}" styleClass="form-control" />
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.AutoDateEnregistrement}" for="dateEnregistrement" styleClass="form-label" />
                    <h:outputText id="dateEnregistrement" value="#{clientController.selected.dateEnregistrement}" styleClass="form-control-plaintext">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </div>
                <div class="col-12">
                    <h:outputLabel value="#{bundle.CreateClientLabel_adresse}" for="adresse" styleClass="form-label" />
                    <h:inputTextarea id="adresse" value="#{clientController.selected.adresse}" styleClass="form-control" rows="3" />
                </div>
                <div class="col-12 d-flex gap-2">
                    <h:commandLink styleClass="btn btn-primary" action="#{clientController.create}" value="#{bundle.CreateClientSaveLink}" />
                    <h:commandLink styleClass="btn btn-outline-secondary" action="#{clientController.prepareList}" value="#{bundle.CreateClientShowAllLink}" immediate="true" />
                    <h:link outcome="/index" styleClass="btn btn-outline-secondary" value="#{bundle.CreateClientIndexLink}" />
                </div>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
