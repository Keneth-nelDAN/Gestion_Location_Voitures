<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{utilisateurController.prepareCreate}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateUtilisateurTitle}" />
        </ui:define>
        <ui:define name="body">
            <p class="text-muted"><h:outputText value="#{bundle.AutoIdInfo}" /></p>
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table" />
            <h:form styleClass="row g-3">
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_nom}" for="nom" styleClass="form-label" />
                    <h:inputText id="nom" value="#{utilisateurController.selected.nom}" styleClass="form-control" required="true" requiredMessage="#{bundle.CreateUtilisateurRequiredMessage_nom}">
                        <f:validateLength minimum="2" maximum="100" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_prenom}" for="prenom" styleClass="form-label" />
                    <h:inputText id="prenom" value="#{utilisateurController.selected.prenom}" styleClass="form-control" required="true" requiredMessage="#{bundle.CreateUtilisateurRequiredMessage_prenom}">
                        <f:validateLength minimum="2" maximum="100" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_email}" for="email" styleClass="form-label" />
                    <h:inputText id="email" value="#{utilisateurController.selected.email}" styleClass="form-control" required="true" requiredMessage="#{bundle.CreateUtilisateurRequiredMessage_email}" validatorMessage="#{bundle.EmailInvalid}">
                        <f:validateRegex pattern="[^@\s]+@[^@\s]+\.[^@\s]+" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_dateCreation}" for="dateCreation" styleClass="form-label" />
                    <h:outputText id="dateCreation" value="#{utilisateurController.selected.dateCreation}" styleClass="form-control-plaintext">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_motDePasse}" for="motDePasse" styleClass="form-label" />
                    <h:inputSecret id="motDePasse" value="#{utilisateurController.selected.motDePasse}" styleClass="form-control" required="true" requiredMessage="#{bundle.CreateUtilisateurRequiredMessage_motDePasse}" validatorMessage="#{bundle.PasswordShort}">
                        <f:validateLength minimum="4" />
                    </h:inputSecret>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_role}" for="role" styleClass="form-label" />
                    <h:selectOneMenu id="role" value="#{utilisateurController.selected.role}" styleClass="form-select" required="true">
                        <f:selectItem itemLabel="Utilisateur" itemValue="UTILISATEUR" />
                        <f:selectItem itemLabel="Administrateur" itemValue="ADMIN" />
                        <f:selectItem itemLabel="Client" itemValue="CLIENT" />
                    </h:selectOneMenu>
                </div>
                <div class="col-12 d-flex gap-2">
                    <h:commandLink styleClass="btn btn-primary" action="#{utilisateurController.create}" value="#{bundle.CreateUtilisateurSaveLink}" />
                    <h:commandLink styleClass="btn btn-outline-secondary" action="#{utilisateurController.prepareList}" value="#{bundle.CreateUtilisateurShowAllLink}" immediate="true" />
                    <h:link outcome="/index" styleClass="btn btn-outline-secondary" value="#{bundle.CreateUtilisateurIndexLink}" />
                </div>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
