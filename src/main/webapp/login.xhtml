<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <f:metadata>
        <f:viewAction action="#{loginController.redirectIfLogged}" />
    </f:metadata>
    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Connexion</title>
        <link rel="shortcut icon" href="#{facesContext.externalContext.requestContextPath}/template/assets/images/favicon.ico" />
        <link rel="stylesheet" href="#{facesContext.externalContext.requestContextPath}/template/assets/css/core/libs.min.css" />
        <link rel="stylesheet" href="#{facesContext.externalContext.requestContextPath}/template/assets/css/hope-ui.min.css?v=4.0.0" />
        <link rel="stylesheet" href="#{facesContext.externalContext.requestContextPath}/template/assets/css/custom.min.css?v=4.0.0" />
        <h:outputStylesheet library="css" name="jsfcrud.css"/>
    </h:head>
    <h:body>
        <div class="container-fluid">
            <div class="row min-vh-100 align-items-center justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <div class="text-center mb-3">
                                <img src="#{facesContext.externalContext.requestContextPath}/template/assets/images/favicon.ico" alt="Logo" style="width:48px;height:48px;" />
                                <h2 class="mt-3 mb-1">Gestion Location Voitures</h2>
                                <p class="text-muted mb-0">Connexion à l'espace société</p>
                            </div>

                            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table" />

                            <h:form styleClass="mt-3">
                                <div class="mb-3">
                                    <h:outputLabel value="Adresse e-mail" for="email" styleClass="form-label" />
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <img src="#{facesContext.externalContext.requestContextPath}/template/assets/vendor/Iconly/Bold/Profile.svg" alt="" style="width:18px;height:18px;" />
                                        </span>
                                        <h:inputText id="email" value="#{loginController.email}" styleClass="form-control"  required="true" requiredMessage="#{bundle.LoginError}" />
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <h:outputLabel value="Mot de passe" for="motDePasse" styleClass="form-label" />
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <img src="#{facesContext.externalContext.requestContextPath}/template/assets/vendor/Iconly/Bold/Lock.svg" alt="" style="width:18px;height:18px;" />
                                        </span>
                                        <h:inputSecret id="motDePasse" value="#{loginController.motDePasse}" styleClass="form-control"  required="true" requiredMessage="#{bundle.LoginError}" />
                                    </div>
                                </div>
                                <h:commandButton styleClass="btn btn-primary w-100" action="#{loginController.login}" value="Se connecter" />
                            </h:form>

                            <p class="text-muted text-center mt-4 mb-0">L'accès est réservé au personnel de la société de location.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </h:body>
</html>
