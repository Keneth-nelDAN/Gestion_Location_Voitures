<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditLocationTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditLocationLabel_idLocation}" for="idLocation" />
                    <h:inputText id="idLocation" value="#{locationController.selected.idLocation}" title="#{bundle.EditLocationTitle_idLocation}" required="true" requiredMessage="#{bundle.EditLocationRequiredMessage_idLocation}"/>
                    <h:outputLabel value="#{bundle.EditLocationLabel_dateCreation}" for="dateCreation" />
                    <h:inputText id="dateCreation" value="#{locationController.selected.dateCreation}" title="#{bundle.EditLocationTitle_dateCreation}" >
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.EditLocationLabel_dateDebutPrevue}" for="dateDebutPrevue" />
                    <h:inputText id="dateDebutPrevue" value="#{locationController.selected.dateDebutPrevue}" title="#{bundle.EditLocationTitle_dateDebutPrevue}" >
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.EditLocationLabel_dateFinPrevue}" for="dateFinPrevue" />
                    <h:inputText id="dateFinPrevue" value="#{locationController.selected.dateFinPrevue}" title="#{bundle.EditLocationTitle_dateFinPrevue}" >
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.EditLocationLabel_dateDebutEffective}" for="dateDebutEffective" />
                    <h:inputText id="dateDebutEffective" value="#{locationController.selected.dateDebutEffective}" title="#{bundle.EditLocationTitle_dateDebutEffective}" >
                        <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.EditLocationLabel_tarifJournalierApplique}" for="tarifJournalierApplique" />
                    <h:inputText id="tarifJournalierApplique" value="#{locationController.selected.tarifJournalierApplique}" title="#{bundle.EditLocationTitle_tarifJournalierApplique}" />
                    <h:outputLabel value="#{bundle.EditLocationLabel_montantEstime}" for="montantEstime" />
                    <h:inputText id="montantEstime" value="#{locationController.selected.montantEstime}" title="#{bundle.EditLocationTitle_montantEstime}" />
                    <h:outputLabel value="#{bundle.EditLocationLabel_statutLocation}" for="statutLocation" />
                    <h:inputText id="statutLocation" value="#{locationController.selected.statutLocation}" title="#{bundle.EditLocationTitle_statutLocation}" />
                    <h:outputLabel value="#{bundle.EditLocationLabel_retour}" for="retour" />
                    <h:selectOneMenu id="retour" value="#{locationController.selected.retour}" title="#{bundle.EditLocationTitle_retour}" >
                        <f:selectItems value="#{retourController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.EditLocationLabel_idClient}" for="idClient" />
                    <h:selectOneMenu id="idClient" value="#{locationController.selected.idClient}" title="#{bundle.EditLocationTitle_idClient}" required="true" requiredMessage="#{bundle.EditLocationRequiredMessage_idClient}">
                        <f:selectItems value="#{clientController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.EditLocationLabel_idUtilisateur}" for="idUtilisateur" />
                    <h:selectOneMenu id="idUtilisateur" value="#{locationController.selected.idUtilisateur}" title="#{bundle.EditLocationTitle_idUtilisateur}" required="true" requiredMessage="#{bundle.EditLocationRequiredMessage_idUtilisateur}">
                        <f:selectItems value="#{utilisateurController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.EditLocationLabel_idVehicule}" for="idVehicule" />
                    <h:selectOneMenu id="idVehicule" value="#{locationController.selected.idVehicule}" title="#{bundle.EditLocationTitle_idVehicule}" required="true" requiredMessage="#{bundle.EditLocationRequiredMessage_idVehicule}">
                        <f:selectItems value="#{vehiculeController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{locationController.update}" value="#{bundle.EditLocationSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditLocationViewLink}"/>
                <br />
                <h:commandLink action="#{locationController.prepareList}" value="#{bundle.EditLocationShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditLocationIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
