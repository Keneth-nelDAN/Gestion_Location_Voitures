<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListLocationTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <div class="d-flex justify-content-end gap-2 mb-3">
                <h:link outcome="/location/Calendar" styleClass="btn btn-sm btn-outline-primary">Calendrier</h:link>
                <h:link outcome="/location/Create" styleClass="btn btn-sm btn-primary">Nouvelle location</h:link>
            </div>
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <h:outputText escape="false" value="#{bundle.ListLocationEmpty}" rendered="#{locationController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{locationController.items.rowCount > 0}">
                    <h:outputText value="#{locationController.pagination.pageFirstItem + 1}..#{locationController.pagination.pageLastItem + 1}/#{locationController.pagination.itemsCount}"/>&#160;
                    <h:commandLink action="#{locationController.previous}" value="#{bundle.Previous} #{locationController.pagination.pageSize}" rendered="#{locationController.pagination.hasPreviousPage}"/>&#160;
                    <h:commandLink action="#{locationController.next}" value="#{bundle.Next} #{locationController.pagination.pageSize}" rendered="#{locationController.pagination.hasNextPage}"/>&#160;
                    <h:dataTable value="#{locationController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_idLocation}"/>
                            </f:facet>
                            <h:outputText value="#{item.idLocation}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_dateCreation}"/>
                            </f:facet>
                            <h:outputText value="#{item.dateCreation}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_dateDebutPrevue}"/>
                            </f:facet>
                            <h:outputText value="#{item.dateDebutPrevue}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_dateFinPrevue}"/>
                            </f:facet>
                            <h:outputText value="#{item.dateFinPrevue}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_dateDebutEffective}"/>
                            </f:facet>
                            <h:outputText value="#{item.dateDebutEffective}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_tarifJournalierApplique}"/>
                            </f:facet>
                            <h:outputText value="#{item.tarifJournalierApplique}"><f:convertNumber pattern="#,##0" /></h:outputText>
                            <h:outputText value="&#160;FCFA" styleClass="text-muted"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_montantEstime}"/>
                            </f:facet>
                            <h:outputText value="#{item.montantEstime}"><f:convertNumber pattern="#,##0" /></h:outputText>
                            <h:outputText value="&#160;FCFA" styleClass="text-muted"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_statutLocation}"/>
                            </f:facet>
                            <h:outputText value="#{item.statutLocation}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_retour}"/>
                            </f:facet>
                            <h:outputText value="#{item.retour}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_idClient}"/>
                            </f:facet>
                            <h:outputText value="#{item.idClient}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_idUtilisateur}"/>
                            </f:facet>
                            <h:outputText value="#{item.idUtilisateur}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListLocationTitle_idVehicule}"/>
                            </f:facet>
                            <h:outputText value="#{item.idVehicule}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&#160;"/>
                            </f:facet>
                            <h:commandLink action="#{locationController.valider}" value="Valider" rendered="#{locationController.isPending(item)}">
                                <f:setPropertyActionListener target="#{locationController.selected}" value="#{item}" />
                            </h:commandLink>
                            <h:outputText value=" " rendered="#{locationController.isPending(item)}"/>
                            <h:commandLink action="#{locationController.prepareView}" value="#{bundle.ListLocationViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{locationController.prepareEdit}" value="#{bundle.ListLocationEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{locationController.destroy}" value="#{bundle.ListLocationDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{locationController.prepareCreate}" value="#{bundle.ListLocationCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListLocationIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
