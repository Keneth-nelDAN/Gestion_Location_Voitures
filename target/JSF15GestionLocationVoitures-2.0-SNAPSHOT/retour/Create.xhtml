<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="/template.xhtml">
        <f:metadata>
            <f:viewAction action="#{retourController.prepareCreate}" />
        </f:metadata>
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateRetourTitle}" />
        </ui:define>
        <ui:define name="body">
            <p class="text-muted"><h:outputText value="#{bundle.AutoIdInfo}" /></p>
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table" />
            <h:form styleClass="row g-3">
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.AutoDateRetour}" for="dateRetourEffective" styleClass="form-label" />
                    <h:outputText id="dateRetourEffective" value="#{retourController.selected.dateRetourEffective}" styleClass="form-control-plaintext">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:outputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateRetourLabel_kilometrageRetour}" for="kilometrageRetour" styleClass="form-label" />
                    <h:inputText id="kilometrageRetour" value="#{retourController.selected.kilometrageRetour}" styleClass="form-control">
                        <f:validateLongRange minimum="0" />
                    </h:inputText>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateRetourLabel_etatAuRetour}" for="etatAuRetour" styleClass="form-label" />
                    <h:selectOneMenu id="etatAuRetour" value="#{retourController.selected.etatAuRetour}" styleClass="form-select" required="true">
                        <f:selectItem itemLabel="#{bundle.RetourEtatBon}" itemValue="Bon état" />
                        <f:selectItem itemLabel="#{bundle.RetourEtatUsure}" itemValue="Usure normale" />
                        <f:selectItem itemLabel="#{bundle.RetourEtatDegrade}" itemValue="Dégradé" />
                    </h:selectOneMenu>
                </div>
                <div class="col-md-6">
                    <h:outputLabel value="#{bundle.CreateRetourLabel_idLocation}" for="idLocation" styleClass="form-label" />
                    <h:selectOneMenu id="idLocation" value="#{retourController.selected.idLocation}" styleClass="form-select" required="true" requiredMessage="#{bundle.CreateRetourRequiredMessage_idLocation}">
                        <f:selectItems value="#{retourController.locationsSansRetourSelectOne}" />
                    </h:selectOneMenu>
                </div>
                <div class="col-12">
                    <h:outputLabel value="#{bundle.CreateRetourLabel_observations}" for="observations" styleClass="form-label" />
                    <h:inputTextarea id="observations" value="#{retourController.selected.observations}" styleClass="form-control" rows="3" />
                </div>
                <div class="col-12 d-flex gap-2">
                    <h:commandLink styleClass="btn btn-primary" action="#{retourController.create}" value="#{bundle.CreateRetourSaveLink}" />
                    <h:commandLink styleClass="btn btn-outline-secondary" action="#{retourController.prepareList}" value="#{bundle.CreateRetourShowAllLink}" immediate="true" />
                    <h:link outcome="/index" styleClass="btn btn-outline-secondary" value="#{bundle.CreateRetourIndexLink}" />
                </div>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
