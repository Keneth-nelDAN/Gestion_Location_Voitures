<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListVehiculeTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <h:outputText escape="false" value="#{bundle.ListVehiculeEmpty}" rendered="#{vehiculeController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{vehiculeController.items.rowCount > 0}">
                    <h:outputText value="#{vehiculeController.pagination.pageFirstItem + 1}..#{vehiculeController.pagination.pageLastItem + 1}/#{vehiculeController.pagination.itemsCount}"/>&#160;
                    <h:commandLink action="#{vehiculeController.previous}" value="#{bundle.Previous} #{vehiculeController.pagination.pageSize}" rendered="#{vehiculeController.pagination.hasPreviousPage}"/>&#160;
                    <h:commandLink action="#{vehiculeController.next}" value="#{bundle.Next} #{vehiculeController.pagination.pageSize}" rendered="#{vehiculeController.pagination.hasNextPage}"/>&#160;
                    <h:dataTable value="#{vehiculeController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVehiculeTitle_idVehicule}"/>
                            </f:facet>
                            <h:outputText value="#{item.idVehicule}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVehiculeTitle_immatriculation}"/>
                            </f:facet>
                            <h:outputText value="#{item.immatriculation}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVehiculeTitle_marque}"/>
                            </f:facet>
                            <h:outputText value="#{item.marque}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVehiculeTitle_modele}"/>
                            </f:facet>
                            <h:outputText value="#{item.modele}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVehiculeTitle_categorie}"/>
                            </f:facet>
                            <h:outputText value="#{item.categorie}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVehiculeTitle_couleur}"/>
                            </f:facet>
                            <h:outputText value="#{item.couleur}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVehiculeTitle_kilometrage}"/>
                            </f:facet>
                            <h:outputText value="#{item.kilometrage}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVehiculeTitle_tarifJournalier}"/>
                            </f:facet>
                            <h:outputText value="#{item.tarifJournalier}"><f:convertNumber pattern="#,##0" /></h:outputText>
                            <h:outputText value="&#160;FCFA" styleClass="text-muted"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVehiculeTitle_etatVehicule}"/>
                            </f:facet>
                            <h:outputText value="#{item.etatVehicule}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVehiculeTitle_statutDisponible}"/>
                            </f:facet>
                            <h:outputText value="#{item.statutDisponible}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&#160;"/>
                            </f:facet>
                            <h:commandLink action="#{locationController.prepareCreateFromVehicule}" value="#{bundle.ListVehiculeRentLink}" rendered="#{vehiculeController.isDisponible(item)}">
                                <f:param name="vehiculeId" value="#{item.idVehicule}" />
                            </h:commandLink>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{vehiculeController.prepareView}" value="#{bundle.ListVehiculeViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{vehiculeController.prepareEdit}" value="#{bundle.ListVehiculeEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{vehiculeController.destroy}" value="#{bundle.ListVehiculeDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{vehiculeController.prepareCreate}" value="#{bundle.ListVehiculeCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListVehiculeIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
